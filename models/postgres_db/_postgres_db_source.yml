version: 2

sources:

  - name: address_postgre_db
    schema: postgre_db
    database: DB39_BRONZE_DB

    quoting:
      database: false
      schema: false
      identifier: false

    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:

      - name: addresses
        config:
          loaded_at_field: _fivetran_synced
        columns:                    
          - name: address_id        
            description: direcciones
          - name: zipcode
          - name: country
          - name: address
          - name: state
          - name: _fivetran_deleted
          - name: _fivetran_synced